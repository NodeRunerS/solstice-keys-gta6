<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solstice Keys</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0618; font-family: "Segoe UI", system-ui, sans-serif; }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    #hud, #menu { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #menu { pointer-events: auto; z-index: 3; }
    .hidden { display: none !important; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas" aria-label="Solstice Keys open world"></canvas>
  <div id="hud"></div>
  <div id="menu"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
